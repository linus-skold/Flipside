name: Package and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    env:
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag the alpha build
        id: tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          latest=$(git tag -l 'v*' | { grep -Ev -- '-(alpha|beta)' || true; } | sort -V | tail -n 1)
          if ! [[ "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            latest=v0.0.0
          fi
          IFS=. read -r major minor patch <<< "${latest#v}"
          tag="v${major}.${minor}.$((patch + 1))-alpha.${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Alpha build $tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "Created tag $tag"
          echo "name=$tag" >> "$GITHUB_OUTPUT"
      - name: Package and release (tag push)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: BigWigsMods/packager@v2
      - name: Package and release (alpha from main)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: BigWigsMods/packager@v2
        env:
          # The packager skips a branch run when HEAD has a tag. Make this run look like the tag run.
          GITHUB_REF: refs/tags/${{ steps.tag.outputs.name }}
          GITHUB_REF_NAME: ${{ steps.tag.outputs.name }}
          GITHUB_REF_TYPE: tag
      - name: Make the alpha build a normal release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.tag.outputs.name }}" --prerelease=false --latest
      - name: Delete old alpha pre-releases
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.tagName | test("-alpha\\."))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | while read -r tag; do
                echo "Delete $tag"
                gh release delete "$tag" --cleanup-tag --yes
              done
name: Package and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to package, for example v0.0.1-alpha.5'
        required: true
        type: string
      make_latest_release:
        description: 'Make the build a normal release and delete old alpha releases'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml

  # Push to main: make the next alpha tag and start a second run for that tag.
  tag:
    name: Tag alpha build
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag the alpha build and start the release run
        run: |
          latest=$(git tag -l 'v*' | { grep -Ev -- '-(alpha|beta)' || true; } | sort -V | tail -n 1)
          if ! [[ "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            latest=v0.0.0
          fi
          IFS=. read -r major minor patch <<< "${latest#v}"
          tag="v${major}.${minor}.$((patch + 1))-alpha.${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Alpha build $tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "Created tag $tag"
          gh workflow run release.yml --ref "$tag" -f tag="$tag" -f make_latest_release=true

  # Tag push by hand, or the run that the tag job starts.
  release:
    name: Release
    needs: test
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      # The packager v2 script reads GITHUB_OAUTH and CF_API_KEY, not GH_API_TOKEN and CF_API_TOKEN.
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Write the changelog since the previous tag
        run: |
          # The packager skips alpha tags, so it lists the full history. Write a short changelog here.
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD~ 2>/dev/null || true)
          range=${prev:+$prev..}HEAD
          {
            echo "## Changes since ${prev:-the start}"
            echo
            git log --no-merges --pretty='- %s (%h)' "$range" | head -n 200
          } | head -c 100000 > CHANGELOG.md
          wc -c CHANGELOG.md
      - name: Package and release
        uses: BigWigsMods/packager@v2
      - name: Make the alpha build a normal release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.make_latest_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release edit "${{ inputs.tag }}" --prerelease=false --latest; then
            echo "::error::Release ${{ inputs.tag }} not found. The packager did not upload it. Check the packager log for a GitHub token line."
            exit 1
          fi
      - name: Delete old alpha releases
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.make_latest_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("-alpha\\."))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | while read -r tag; do
                echo "Delete $tag"
                gh release delete "$tag" --cleanup-tag --yes
              done